name: build-crownlink

# Build CrownLink.snp on a Windows runner (MSVC + Ninja + Python), mirroring the local
# CMakePresets "x86-release" workflow. Used to produce a CrownLink.snp carrying the
# cosmo-rollback transport exports (`cl_rollback_*`, ADR-0001 §2.1) without needing a
# Windows development machine.

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Version.cmake derives the version from the git tag, so the full history/tags
          # must be present.
          fetch-depth: 0

      - name: Set up MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Show tools
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          python --version
          where.exe cl.exe

      - name: Configure
        shell: pwsh
        run: cmake --preset x86-release

      - name: Build (dist SNP)
        shell: pwsh
        run: cmake --build out/build/x86-release --target crownlink_dist

      - name: Collect artifact
        shell: pwsh
        run: |
          # Collect the *dist* SNP (dll + caps.mpq appended), not the bare linker output:
          # without the caps archive Storm cannot enumerate the provider, so the game never
          # lists CrownLink. Both files are named CrownLink.snp, so a recursive copy raced
          # and shipped the caps-less one.
          New-Item -ItemType Directory -Force -Path out/artifacts | Out-Null
          $dist = "out/build/x86-release/dist/CrownLink.snp"
          if (-not (Test-Path $dist)) { throw "missing $dist (crownlink_dist target did not run)" }
          Copy-Item $dist out/artifacts/
          $bytes = [System.IO.File]::ReadAllBytes($dist)
          $header = [System.Text.Encoding]::ASCII.GetString($bytes, 0, $bytes.Length)
          if (-not $header.Contains("MPQ" + [char]0x1a)) { throw "dist SNP has no caps.mpq appended" }
          Get-ChildItem out/artifacts | Format-Table Name,Length

      - uses: actions/upload-artifact@v4
        with:
          name: CrownLink-snp
          path: out/artifacts/*
          if-no-files-found: warn
